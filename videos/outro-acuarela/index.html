<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Meapica outro: acuarela</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --paper: #fff8f0; --deep: #5d4037; --orange: #e86c3a; --glow: rgba(232, 108, 58, 0.17); --edge: rgba(93, 64, 55, 0.07); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
      #sting { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #paper { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, transparent 45%, var(--edge) 100%); }
      #bloom { position: absolute; left: 50%; top: 50%; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%;
        background: radial-gradient(circle, var(--glow) 0%, transparent 62%); opacity: 0; }
      #lockup { position: relative; width: 840px; }
      #logo { display: block; width: 840px; height: auto; overflow: visible; }
      .ink { fill: var(--deep); }
      #bloom { display: none; }
      #washes { position: absolute; inset: 0; width: 100%; height: 100%; }
      .wash { mix-blend-mode: multiply; opacity: 0; }
      #crisp { opacity: 0; }
    </style>
  </head>

              <mask id="soak" maskUnits="userSpaceOnUse" x="-80" y="-80" width="1300" height="415">

            </defs>
            <g id="wet-logo" mask="url(#soak)"><g filter="url(#bleed)"><use href="#shape" /></g></g>
            <!-- The clean vector logo takes over once the ink has settled. -->

      </section>

    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // The washes spread first, one over another, and stay as a stain behind the name.
      tl.fromTo("#wash-a", { opacity: 0, scale: 0.25, svgOrigin: "470 930" }, { opacity: 0.4, scale: 1, duration: 1.5, ease: "power2.out" }, 0.05);
      tl.fromTo("#wash-b", { opacity: 0, scale: 0.25, svgOrigin: "660 1010" }, { opacity: 0.32, scale: 1, duration: 1.5, ease: "power2.out" }, 0.25);
      tl.fromTo("#wash-c", { opacity: 0, scale: 0.25, svgOrigin: "590 900" }, { opacity: 0.45, scale: 1, duration: 1.4, ease: "power2.out" }, 0.45);
      // The ink arrives from the left and tightens from blots into letters.
      const soak = { x: 0 };
      const solid = document.getElementById("soak-solid"), edge = document.getElementById("soak-edge");
      const pour = () => { solid.setAttribute("width", Math.max(0, soak.x - 200)); edge.setAttribute("x", -80 + soak.x - 200); }; // the soft edge starts off the logo
      tl.fromTo(soak, { x: 0 }, { x: 1500, duration: 1.5, ease: "power1.inOut", onUpdate: pour }, 0.6);
      tl.fromTo("#bleed-blur", { attr: { stdDeviation: 16 } }, { attr: { stdDeviation: 0.6 }, duration: 1.9, ease: "power2.inOut" }, 0.6);
      tl.fromTo("#bleed-warp", { attr: { scale: 26 } }, { attr: { scale: 0 }, duration: 1.9, ease: "power2.inOut" }, 0.6);
      tl.fromTo("#crisp", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 2.35);
      tl.fromTo("#wet-logo", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "none" }, 2.65);
      tl.fromTo("#lockup", { scale: 1.08 }, { scale: 1, duration: 2.6, ease: "power2.out" }, 0);
      tl.to("#lockup", { scale: 1.03, duration: 1.2, ease: "sine.inOut" }, 2.6);
      pour();
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
