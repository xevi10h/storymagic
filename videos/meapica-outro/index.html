    <title>Meapica outro</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #fff8f0;
        --deep: #5d4037;
        --tip: #e86c3a;
        --glow: rgba(232, 108, 58, 0.17);
        --edge: rgba(93, 64, 55, 0.07);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
      #sting { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #paper { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, transparent 45%, var(--edge) 100%); }
      #bloom { position: absolute; left: 50%; top: 50%; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%;
        background: radial-gradient(circle, var(--glow) 0%, transparent 62%); opacity: 0; }
      #lockup { position: relative; width: 840px; }
      #logo { display: block; width: 840px; height: auto; overflow: visible; }
      .ink { fill: var(--deep); }
      /* The drawn line: the logo's own contour, traced. Units are the traced path's (10 per viewBox unit). */
      .line { fill: none; stroke: var(--deep); stroke-width: 38; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
      .tip { fill: var(--tip); opacity: 0; }
    </style>

    <script>
      const tl = gsap.timeline({ paused: true });
      const penTop = document.getElementById("pen-top");
      const penBottom = document.getElementById("pen-bottom");
      const tipTop = document.getElementById("tip-top");
      const tipBottom = document.getElementById("tip-bottom");
      const flood = document.getElementById("flood-rect");
      const floodEdge = document.getElementById("flood-edge");
      const dotFill = document.getElementById("dot-fill");
      const L = penTop.getTotalLength();

      // The contour is one closed line that starts at the tip of the left leaf. Find where it is furthest right:
      // the top pen runs 0 → there, the bottom pen runs backwards from the end → there, so both travel left to right.
      const STEPS = 800;
      let meet = 0, maxX = -Infinity;
      for (let i = 0; i <= STEPS; i++) {
        const x = penTop.getPointAtLength((L * i) / STEPS).x;
        if (x > maxX) { maxX = x; meet = (L * i) / STEPS; }
      }
      // How far right the contour is completely drawn at each step of the trace: the smallest x still waiting for
      // a pen. The ink may only flood up to there. Precomputed so any frame can be rendered on its own.
      const SAMPLES = 1600;
      const points = [];
      for (let i = 0; i <= SAMPLES; i++) {
        const at = (L * i) / SAMPLES;
        points.push({ at, x: penTop.getPointAtLength(at).x / 10 });
      }
      const frontier = [];
      for (let i = 0; i <= STEPS; i++) {
        const a = (meet * i) / STEPS, b = L - ((L - meet) * i) / STEPS;
        let waiting = Infinity;
        for (const pt of points) if (pt.at > a && pt.at < b && pt.x < waiting) waiting = pt.x;
        frontier.push(waiting === Infinity ? maxX / 10 : waiting);
      }
      // Inner contours (the page of the book, the eyes of the "e" and the "p") and the dot of the "i" are drawn
      // as the pens pass over them.
      const inner = [...document.querySelectorAll(".line.inner")].map((el) => {
        const box = el.getBBox();
        return { el, len: el.getTotalLength(), x0: box.x / 10, x1: (box.x + box.width) / 10 };
      });
      const dotLine = inner.find((s) => s.el.id === "dot-line");

      const LAG = 14; // the ink stays this far behind the finished line
      const pen = { p: 0, rest: 0 };
      const render = () => {
        const p = pen.p;
        const reach = frontier[Math.round(p * STEPS)];
        const a = meet * p; // top pen: [0, a]
        const b = (L - meet) * p; // bottom pen: [L - b, L]
        penTop.style.strokeDasharray = a + " " + L;
        penBottom.style.strokeDasharray = b + " " + L;
        penBottom.style.strokeDashoffset = b - L;
        penTop.style.opacity = penBottom.style.opacity = p > 0 ? 1 : 0;
        const pa = penTop.getPointAtLength(a), pb = penTop.getPointAtLength(L - b);
        tipTop.setAttribute("cx", pa.x); tipTop.setAttribute("cy", pa.y);
        tipBottom.setAttribute("cx", pb.x); tipBottom.setAttribute("cy", pb.y);
        const tipOn = p > 0 && p < 1 ? Math.min(1, p * 12, (1 - p) * 12) : 0;
        tipTop.style.opacity = tipBottom.style.opacity = tipOn;
        for (const s of inner) {
          const q = Math.min(1, Math.max(0, (reach - s.x0 + 8) / (s.x1 - s.x0 + 16)));
          s.el.style.strokeDasharray = s.len * q + " " + s.len;
          s.el.style.opacity = q > 0 ? 1 : 0;
        }
        const dotIn = Math.min(1, Math.max(0, (reach - dotLine.x1 - 6) / 40));
        dotFill.style.opacity = dotIn;
        const inkEnd = reach - LAG + pen.rest; // where the ink stops: solid up to 70 units before, then a soft edge
        flood.setAttribute("width", Math.max(0, inkEnd - 70 + 40));
        floodEdge.setAttribute("x", inkEnd - 70);
      };
      // The trace: one long, even gesture. The last of the ink catches up once the pens have met.
      tl.fromTo(pen, { p: 0 }, { p: 1, duration: 1.75, ease: "sine.inOut", onUpdate: render }, 0.15);
      tl.fromTo(pen, { rest: 0 }, { rest: 200, duration: 0.4, ease: "power1.out", onUpdate: render }, 1.85);
      // The line has done its job: it dissolves into the ink.
      tl.fromTo("#lines", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.out" }, 2.1);
      // The lockup settles, breathes once, and a warm bloom swells behind it.
      tl.fromTo("#lockup", { scale: 1.08 }, { scale: 1, duration: 2.3, ease: "power2.out" }, 0);
      tl.to("#lockup", { scale: 1.03, duration: 1.3, ease: "sine.inOut" }, 2.3);
      tl.fromTo("#bloom", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 1.1, ease: "power2.out" }, 1.9);
      render();
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
