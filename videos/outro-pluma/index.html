    <title>Meapica outro: pluma</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --paper: #fff8f0; --deep: #5d4037; --orange: #e86c3a; --glow: rgba(232, 108, 58, 0.17); --edge: rgba(93, 64, 55, 0.07); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
      #sting { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #paper { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, transparent 45%, var(--edge) 100%); }
      #bloom { position: absolute; left: 50%; top: 50%; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%;
        background: radial-gradient(circle, var(--glow) 0%, transparent 62%); opacity: 0; }
      #lockup { position: relative; width: 840px; }
      #logo { display: block; width: 840px; height: auto; overflow: visible; }
      .ink { fill: var(--deep); }
      .pen { fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
      .word { stroke-width: 40; }
      #nib { opacity: 0; }

    <script>
      const tl = gsap.timeline({ paused: true });
      // One gesture = strokes written end to end without lifting the pen. [stroke ids, start, duration, ease].
      // The letters get their durations from their length, so the hand keeps an even writing speed.
      const gestures = [
        { ids: ["l1", "l2"], at: 0.1, dur: 0.42, ease: "power2.inOut" },
        { ids: ["sp"], at: 0.56, dur: 0.24, ease: "power2.inOut" },
        { ids: ["r1", "r2", "r3"], at: 0.84, dur: 0.5, ease: "power2.inOut" },
        { ids: ["ll"], at: 1.38, dur: 0.16, ease: "power2.out" },
        { ids: ["lr"], at: 1.58, dur: 0.16, ease: "power2.out" },
      ];
      const WORD_START = 1.8, WORD_TIME = 1.25, LIFT = 0.06;
      const letters = [["w1", "w2"], ["w3", "w4", "w5"], ["w6", "w7"], ["w8", "w9"], ["w10"]];
      const measure = (ids) => ids.map((id) => { const el = document.getElementById(id); return { el, len: el.getTotalLength() }; });
      const wordLength = letters.flat().reduce((sum, id) => sum + document.getElementById(id).getTotalLength(), 0);
      let cursor = WORD_START;
      for (const ids of letters) {
        const dur = (WORD_TIME * measure(ids).reduce((s, p) => s + p.len, 0)) / wordLength;
        gestures.push({ ids, at: cursor, dur, ease: "sine.inOut" });
        cursor += dur + LIFT;
      }
      for (const g of gestures) {
        g.parts = measure(g.ids);
        g.total = g.parts.reduce((s, p) => s + p.len, 0);
        g.easeFn = gsap.parseEase(g.ease);
        for (const { el, len } of g.parts) { el.style.strokeDasharray = len + " " + len * 3; el.style.strokeDashoffset = len; }
      }
      const WRITE_END = gestures.at(-1).at + gestures.at(-1).dur;
      const nib = document.getElementById("nib");
      const tipOf = (g, p) => {
        let done = p * g.total;
        for (const { el, len } of g.parts) { if (done <= len) return el.getPointAtLength(done); done -= len; }
        const last = g.parts.at(-1);
        return last.el.getPointAtLength(last.len);
      };
      // Everything is a pure function of time, so any frame can be rendered on its own.
      const clock = { t: 0 };
      const render = () => {
        const t = clock.t;
        let tip = null;
        gestures.forEach((g, i) => {
          const p = g.easeFn(Math.min(1, Math.max(0, (t - g.at) / g.dur)));
          let done = p * g.total;
          for (const { el, len } of g.parts) {
            const drawn = Math.min(Math.max(done, 0), len);
            el.style.strokeDashoffset = len - drawn;
            el.style.opacity = drawn > 0 ? 1 : 0; // a round cap would show as a dot before the pen arrives
            done -= len;
          }
          if (t >= g.at && t <= g.at + g.dur) tip = { ...pt(tipOf(g, p)), lift: 0 };
          const next = gestures[i + 1];
          if (next && t > g.at + g.dur && t < next.at) {
            // Pen in the air between two strokes: it travels to where the next one starts.
            const k = gsap.parseEase("sine.inOut")((t - g.at - g.dur) / (next.at - g.at - g.dur));
            const a = pt(tipOf(g, 1)), b = pt(tipOf(next, 0));
            tip = { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, lift: Math.sin(Math.PI * k) * 9 };
          }
        });
        const first = gestures[0];
        if (t < first.at) tip = { ...pt(tipOf(first, 0)), lift: 0 };
        let alpha = Math.min(1, t / 0.12);
        if (t > WRITE_END) {
          const k = Math.min(1, (t - WRITE_END) / 0.35); // the hand leaves the page
          const end = pt(tipOf(gestures.at(-1), 1));
          tip = { x: end.x + 40 * k, y: end.y - 46 * k, lift: 0 };
          alpha = 1 - k;
        }
        nib.setAttribute("transform", "translate(" + tip.x + " " + (tip.y - tip.lift) + ")");
        nib.style.opacity = alpha;
      };
      function pt(p) { return { x: p.x, y: p.y }; }
      tl.fromTo(clock, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: render }, 0);
      // Any sliver the strokes missed fills in softly: the M once it is drawn, the rest once the word is written.
      tl.fromTo("#m-full", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 1.74);
      tl.fromTo("#all", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, WRITE_END);
      // Last touch of the pen: the dot of the i.
      tl.fromTo("#dot", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, WRITE_END + 0.04);
      tl.fromTo("#lockup", { scale: 1.1 }, { scale: 1, duration: 3.1, ease: "power2.out" }, 0);
      tl.to("#lockup", { scale: 1.03, duration: 0.9, ease: "sine.inOut" }, 3.1);
      tl.fromTo("#bloom", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 1, ease: "power2.out" }, 2.9);
      render();
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
