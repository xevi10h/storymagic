<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Meapica closing: short (social reels)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fredoka"; src: url("assets/Fredoka.ttf") format("truetype"); font-weight: 300 700; }
      :root { --paper: #fff8f0; --deep: #5d4037; --orange: #e86c3a; --glow: rgba(232, 108, 58, 0.17); --edge: rgba(93, 64, 55, 0.07); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
      #sting { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; padding-bottom: 150px; font-family: "Fredoka", sans-serif; }
      /* Compact corporate closing for short organic reels (owner 2026-10-07): logo, tagline, one action, address. */
      #tag { position: relative; font-weight: 600; font-size: 60px; line-height: 1.12; color: var(--deep); text-align: center; margin-top: 30px; }
      #cta { position: relative; font-weight: 700; font-size: 50px; color: #fff; background: #d95f2e; padding: 20px 56px 24px; border-radius: 999px; }
      #addr { position: relative; font-weight: 600; font-size: 58px; color: var(--deep); }
      #paper { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, transparent 45%, var(--edge) 100%); }
      #bloom { position: absolute; left: 50%; top: 50%; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%;
        background: radial-gradient(circle, var(--glow) 0%, transparent 62%); opacity: 0; }
      #lockup { position: relative; width: 760px; }
      #logo { display: block; width: 760px; height: auto; overflow: visible; }
      .ink { fill: var(--deep); }
      #whole { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="3.2">
      <section id="sting" class="clip" data-start="0" data-duration="3.2" data-track-index="0">
        <div id="paper"></div>
        <div id="bloom"></div>
        <div id="lockup">
          <!-- The book "M" is the real logo cut into its parts (spine, two pages, two loose leaves). The spine stands up,
               the pages swing open from it, the leaves flick out, and the name flows out of the open book. -->

6 130 95 0 58 -50 110 -151 154 -167 74 -407 68 -571 -15 -77 -39 -205 -172 -250 -259 -56 -111 -98 -261 -98 -354 0 -51 -70 -162 -154 -247 -151 -151 -350 -201 -530 -134 -138 52 -226 214 -226 415 1 266 147 458 349 458 48 0 78 -6 108 -22 50 -25 67 -49 84 -114 16 -64 41 -81 116 -75 48 4 61 10 85 37 23 26 28 40 28 84 -1 98 -58 178 -164 228 -87 42 -154 52 -286 46 -177 -8 -273 -48 -386 -161 -137 -137 -192 -303 -181 -547 l6 -136 -35 -74 c-48 -99 -79 -138 -130 -160 -49 -22 -80 -15 -112 26 -38 49 -45 142 -36 485 13 451 12 481 -8 513 -25 37 -86 52 -147 37 -61 -15 -88 -43 -107 -110 -28 -95 -84 -190 -163 -272 -40 -43 -77 -78 -82 -78 -4 0 -15 26 -24 58 -61 214 -199 357 -391 407 -113 29 -278 14 -374 -35 -48 -25 -134 -102 -161 -147 -13 -20 -24 -32 -25 -27 -2 5 -8 43 -15 84 -16 101 -43 130 -124 130 -67 0 -121 -21 -136 -53 -8 -18 -6 -42 10 -104 29 -111 44 -269 39 -388 -4 -84 -12 -121 -48 -229 -48 -144 -118 -264 -169 -290 -79 -41 -142 -3 -157 96 -4 29 -6 139 -4 243 7 315 8 312 -21 341 -22 21 -35 25 -84 25 -70 0 -109 -14 -124 -47 -6 -14 -11 -73 -11 -132 0 -335 -113 -536 -310 -550 -142 -10 -240 73 -281 238 -19 77 -16 240 6 320 62 225 182 347 351 358 91 6 135 -9 196 -66 42 -40 56 -46 101 -50 140 -11 195 94 95 183 -149 135 -459 155 -671 43 -38 -20 -93 -63 -139 -110 -119 -119 -184 -267 -203 -461 -8 -75 -26 -108 -114 -207 -156 -178 -424 -281 -623 -239 -107 23 -191 80 -238 163 -43 74 -41 86 18 86 147 0 328 41 457 104 106 52 160 96 209 171 96 144 79 330 -40 450 -50 49 -124 87 -202 104 -67 14 -211 14 -288 0 -228 -41 -420 -250 -461 -502 l-16 -96 -38 21 c-86 48 -168 148 -212 259 -57 143 -58 208 -10 554 30 218 27 253 -21 301 -49 49 -98 58 -241 45 -155 -15 -290 -43 -423 -87 -168 -57 -267 -112 -431 -239 l-26 -20 23 31 c42 60 169 169 257 221 105 63 259 124 370 148 138 30 150 35 153 77 2 28 -2 40 -20 52 -30 21 -47 20 -159 -9 -164 -42 -314 -112 -440 -206 -75 -55 -199 -182 -247 -251 -34 -49 -104 -189 -116 -230 -6 -20 -11 -14 -40 48 -90 192 -218 348 -372 454 -139 96 -358 186 -499 204 -38 5 -55 3 -72 -9z m1983 -467 c-33 -263 -40 -373 -40 -633 0 -206 4 -320 17 -430 10 -82 20 -160 23 -171 5 -20 0 -22 -68 -28 -184 -18 -397 -77 -527 -147 -79 -42 -188 -124 -220 -165 -11 -14 -22 -21 -25 -16 -9 15 -44 244 -61 392 -24 219 -29 366 -16 483 37 336 162 529 422 651 123 58 340 112 463 115 l39 1 -7 -52z m1316 -489 c70 -36 104 -106 95 -197 -15 -144 -178 -247 -430 -273 -142 -14 -147 -12 -147 59 0 115 50 250 121 327 95 103 251 139 361 84z m2963 -621 c-49 -166 -163 -271 -294 -271 -67 0 -98 14 -107 49 -15 58 84 133 261 198 142 53 149 54 140 24z" /></g>
              <clipPath id="page-zone"><polygon points="-40,300 -40,-40 40,-40 40,17 50,19 75,24 100,36 115,48 122,57 132,68 141,80 150,68 160,57 167,48 182,36 207,24 232,19 245,17 245,-40 273,-40 273,300" /></clipPath>
              <clipPath id="cut-left"><rect x="-40" y="-40" width="171.5" height="335" /></clipPath>
              <clipPath id="cut-spine"><rect x="130.5" y="-40" width="20" height="335" /></clipPath>
              <clipPath id="cut-right"><rect x="149.5" y="-40" width="123.5" height="335" /></clipPath>
              <clipPath id="cut-leaf-l"><polygon points="30,-20 141,-20 141,80 132,68 122,57 115,48 100,36 75,24 50,19 40,17 30,17" /></clipPath>
              <clipPath id="cut-leaf-r"><polygon points="141,-20 250,-20 250,17 245,17 232,19 207,24 182,36 167,48 160,57 150,68 141,80" /></clipPath>
              <clipPath id="cut-word"><rect x="272.5" y="-40" width="800" height="335" /></clipPath>
              <linearGradient id="feather" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" /><stop offset="1" stop-color="#000" /></linearGradient>
              <mask id="flow" maskUnits="userSpaceOnUse" x="-40" y="-40" width="1193" height="335">
                <rect id="flow-solid" x="260" y="-40" width="0" height="335" fill="#fff" />
                <rect id="flow-edge" x="260" y="-40" width="90" height="335" fill="url(#feather)" />
              </mask>
            </defs>
            <g id="spine"><g clip-path="url(#page-zone)"><g clip-path="url(#cut-spine)"><use href="#shape" /></g></g></g>
            <g id="page-l"><g clip-path="url(#page-zone)"><g clip-path="url(#cut-left)"><use href="#shape" /></g></g></g>
            <g id="page-r"><g clip-path="url(#page-zone)"><g clip-path="url(#cut-right)"><use href="#shape" /></g></g></g>
            <g id="leaf-l"><g clip-path="url(#cut-leaf-l)"><use href="#shape" /></g></g>
            <g id="leaf-r"><g clip-path="url(#cut-leaf-r)"><use href="#shape" /></g></g>
            <g id="word" mask="url(#flow)"><g clip-path="url(#cut-word)"><use href="#shape" /></g></g>
            <g id="dot"><g transform="translate(0,255) scale(0.1,-0.1)"><path class="ink" d="M7295 2276 c-41 -18 -83 -69 -91 -111 -20 -108 49 -187 166 -189 97 -1 160 53 168 146 4 61 -19 106 -77 145 -39 27 -117 31 -166 9z" /></g></g>
            <!-- The uncut logo takes over at the end, so no seam between the pieces can show. -->
            <g id="whole"><use href="#shape" /></g>
          </svg>
        </div>
        <div id="tag"></div>
        <div id="cta"></div>
        <div id="addr">meapica.shop</div>
      </section>
      <audio id="sting-audio" src="assets/sting.wav" data-start="0" data-duration="3.2" data-track-index="1" data-volume="1"></audio>
    </div>
    <script>
      // Words exactly as on the live site (hero line and main button, read 2026-10-07). Render once per language.
      const LANG = "es";
      const COPY = { es: ["El cuento que te pedirá<br>otra vez", "Crear su libro"], ca: ["El conte que et demanarà<br>un altre cop", "Crear el seu llibre"] }[LANG];
      document.getElementById("tag").innerHTML = COPY[0];
      document.getElementById("cta").textContent = COPY[1];
      // The logo builds exactly as in the long outro (videos/outro-libro), at twice the speed.
      const logo = gsap.timeline();
      // The closed book: only its spine, growing from the top.
      logo.fromTo("#spine", { scaleY: 0, svgOrigin: "141 72" }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 0.1);
      // The pages swing open from the spine, the left one a breath before the right.
      logo.fromTo("#page-l", { scaleX: 0, skewY: 16, svgOrigin: "131 150" }, { scaleX: 1, skewY: 0, duration: 0.7, ease: "back.out(1.5)" }, 0.42);
      logo.fromTo("#page-r", { scaleX: 0, skewY: -16, svgOrigin: "150 150" }, { scaleX: 1, skewY: 0, duration: 0.7, ease: "back.out(1.5)" }, 0.52);
      // The loose leaves flick out of the gutter.
      logo.fromTo("#leaf-l", { autoAlpha: 0, scale: 0.2, rotation: 38, svgOrigin: "141 78" }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, 0.98);
      logo.fromTo("#leaf-r", { autoAlpha: 0, scale: 0.2, rotation: -38, svgOrigin: "141 78" }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, 1.06);
      // The name flows out of the open book, left to right.
      const flow = { x: 0 };
      const solid = document.getElementById("flow-solid"), edge = document.getElementById("flow-edge");
      const pour = () => { solid.setAttribute("width", Math.max(0, flow.x - 90)); edge.setAttribute("x", 260 + flow.x - 90); }; // the soft edge starts behind the book
      logo.fromTo(flow, { x: 0 }, { x: 860, duration: 0.95, ease: "power2.inOut", onUpdate: pour }, 1.2);
      logo.fromTo("#word", { x: -26 }, { x: 0, duration: 0.95, ease: "power2.out" }, 1.2);
      logo.fromTo("#dot", { autoAlpha: 0, y: -80, scale: 0.4, transformOrigin: "50% 50%" }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: "bounce.out" }, 1.95);
      logo.fromTo("#whole", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 2.3);
      // Light comes out of the book as it opens, then spreads behind the whole name.
      logo.fromTo("#bloom", { opacity: 0, scale: 0.25, x: -313 }, { opacity: 1, scale: 0.6, x: -313, duration: 0.7, ease: "power2.out" }, 0.5);
      logo.to("#bloom", { x: 0, scale: 1, duration: 1.2, ease: "power2.inOut" }, 1.2);
      logo.fromTo("#lockup", { scale: 1.1 }, { scale: 1, duration: 2.4, ease: "power2.out" }, 0);
      pour();
      const tl = gsap.timeline({ paused: true });
      tl.add(logo.timeScale(2), 0.1);
      tl.fromTo("#tag", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.95);
      tl.fromTo("#cta", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 1.15);
      tl.fromTo("#addr", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.3);
      // Everything is still from 1.6 s: a 1.6 s hold, and the last frame is the poster.
      window.__timelines["main"] = tl;
      logo.seek(0);
    </script>
