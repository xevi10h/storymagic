<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Meapica: escribe su nombre</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fredoka"; src: url("assets/Fredoka.ttf") format("truetype"); font-weight: 300 700; }
      :root { --paper: #fff8f0; --deep: #5d4037; --orange: #e86c3a; --edge: rgba(93, 64, 55, 0.07); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); font-family: "Fredoka", sans-serif; }
      #scene { position: absolute; inset: 0; }
      /* The whole screen is the current cover's art, out of focus, so the frame is never an empty card. */
      #bg { position: absolute; inset: -140px; }
      .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(46px) saturate(1.1) brightness(0.86); opacity: 0; }
      #paper { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 52%, rgba(20, 14, 10, 0) 40%, rgba(20, 14, 10, 0.3) 100%); }
      .hook { position: absolute; left: 0; right: 0; top: 236px; display: flex; justify-content: center; }
      .hook div { font-weight: 600; font-size: 74px; line-height: 1; color: #1d1410; background: #fff8f0; padding: 22px 44px 26px; border-radius: 30px; box-shadow: 0 10px 30px rgba(20, 14, 10, 0.2); }
      .hook em { font-style: normal; color: #cf5527; }
      #field { position: absolute; left: 150px; top: 404px; width: 780px; height: 136px; border-radius: 30px; background: #fff;
        border: 4px solid rgba(93, 64, 55, 0.16); box-shadow: 0 12px 34px rgba(20, 14, 10, 0.25); display: flex; align-items: center; padding: 0 44px; }
      #typed { font-weight: 600; font-size: 76px; line-height: 1; color: var(--deep); white-space: nowrap; }
      #typed span { display: none; }
      #cursor { width: 6px; height: 78px; margin-left: 6px; border-radius: 3px; background: var(--orange); }
      #book { position: absolute; left: 110px; top: 590px; width: 860px; height: 860px; }
      #book-inner { position: absolute; inset: 0; border-radius: 10px 18px 18px 10px; overflow: hidden;
        box-shadow: 0 34px 60px rgba(60, 36, 24, 0.3), 0 6px 14px rgba(60, 36, 24, 0.18); background: #d9cfc4; }
      .cover { position: absolute; inset: 0; opacity: 0; }
      .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; }
      .scrim { position: absolute; left: 0; right: 0; top: 0; height: 52%; background: linear-gradient(rgba(20, 14, 10, 0.72), rgba(20, 14, 10, 0.5) 55%, rgba(20, 14, 10, 0)); opacity: 0; }
      .title { position: absolute; left: 40px; right: 40px; top: 30px; text-align: center; color: #fff; font-weight: 600; text-shadow: 0 3px 16px rgba(0, 0, 0, 0.55); }
      .name { font-size: 138px; line-height: 1; }
      .name span { display: inline-block; opacity: 0; }
      .rest { font-size: 52px; line-height: 1.1; opacity: 0; }
      #spine { position: absolute; left: 0; top: 0; bottom: 0; width: 34px; background: linear-gradient(90deg, rgba(0, 0, 0, 0.28), rgba(255, 255, 255, 0.16) 45%, rgba(0, 0, 0, 0) 100%); }
      #pill { position: absolute; left: 0; right: 0; top: 1410px; z-index: 3; display: flex; justify-content: center; opacity: 0; }
      #pill span { font-weight: 600; font-size: 46px; color: #cf5527; background: #fff; padding: 12px 34px; border-radius: 999px; box-shadow: 0 6px 18px rgba(93, 64, 55, 0.14); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="13.2">
      <section id="scene" class="clip" data-start="0" data-duration="13.2" data-track-index="0">
        <div id="bg"></div>
        <div id="paper"></div>
        <div class="hook" id="hook-a"><div>Escribe <em>su nombre</em></div></div>
        <div class="hook" id="hook-b"><div>¿Y <em>el suyo?</em> Escríbelo</div></div>
        <div id="field"><div id="typed"></div><div id="cursor"></div></div>
        <div id="book"><div id="book-inner"><div id="covers"></div><div id="spine"></div></div></div>
        <div id="pill"><span>meapica.shop</span></div>
      </section>
      <audio id="music" src="assets/music.mp3" data-start="0" data-duration="13.2" data-track-index="1" data-volume="0.55"></audio>
    </div>
    <script>
      // The five public example books: real cover art and the real title, name first (docs/social/learnings.md).
      const BOOKS = [
        { id: "leo", name: "Leo", rest: "y el valle que rugía" },
        { id: "noa", name: "Noa", rest: "y la llave de flor" },
        { id: "lucia", name: "Lucía", rest: "y el sueño perdido" },
        { id: "marti", name: "Martín", rest: "y la luz guardada" },
        { id: "aitana", name: "Aitana", rest: "y la Perla Cantarina" },
      ];
      const SEG = 2.3, KEY = 0.11, END = BOOKS.length * SEG;
      const letters = (word) => [...word].map((c) => `<span>${c}</span>`).join("");
      document.getElementById("covers").innerHTML = BOOKS.map((b) =>
        `<div class="cover" id="c-${b.id}"><img src="assets/${b.id}.jpg" alt="" /><div class="scrim"></div>` +
        `<div class="title"><div class="name">${letters(b.name)}</div><div class="rest">${b.rest}</div></div></div>`).join("");
      document.getElementById("bg").innerHTML = BOOKS.map((b) => `<img class="bg" id="b-${b.id}" src="assets/${b.id}.jpg" alt="" />`).join("");
      document.getElementById("typed").innerHTML = BOOKS.map((b) => `<span class="w" id="t-${b.id}">${letters(b.name)}</span>`).join("");
      document.querySelectorAll("#typed .w").forEach((w) => (w.style.display = "inline"));

      const tl = gsap.timeline({ paused: true });
      // The book never stops moving: a slow drift for the whole loop, ending where it starts.
      tl.fromTo("#bg", { scale: 1 }, { scale: 1.12, duration: 13.2 / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#book", { scale: 1, rotation: -1.2 }, { scale: 1.035, rotation: 1.2, duration: 13.2 / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#hook-b", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      BOOKS.forEach((b, i) => {
        const t0 = i * SEG, type0 = t0 + 0.2;
        const cover = `#c-${b.id}`;
        // Cover in: the first one is already there on frame one (the art, no title yet).
        if (i === 0) tl.fromTo(`${cover}, #b-${b.id}`, { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
        else {
          tl.fromTo(cover, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t0);
          tl.to(`#c-${BOOKS[i - 1].id}`, { opacity: 0, duration: 0.3, ease: "none" }, t0);
          tl.fromTo(`#b-${b.id}`, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, t0);
          tl.to(`#b-${BOOKS[i - 1].id}`, { opacity: 0, duration: 0.5, ease: "none" }, t0 + 0.5);
        }
        tl.fromTo(`${cover} .scrim`, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, type0);
        // Each key press: the letter lands in the field and on the cover at the same instant.
        [...b.name].forEach((_, k) => {
          const t = type0 + k * KEY;
          tl.set(`#t-${b.id} span:nth-child(${k + 1})`, { display: "inline" }, t);
          tl.fromTo(`${cover} .name span:nth-child(${k + 1})`, { opacity: 0, scale: 0.4, y: 26 }, { opacity: 1, scale: 1, y: 0, duration: 0.22, ease: "back.out(2.4)" }, t);
        });
        const typed = type0 + b.name.length * KEY;
        tl.fromTo(`${cover} .rest`, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, typed + 0.08);
        // Select-all and delete before the next name.
        tl.set(`#t-${b.id} span`, { display: "none" }, t0 + SEG - 0.12);
      });
      // Ending: empty field, the question, and the first cover back without its title (the loop point).
      tl.to("#hook-a", { opacity: 0, duration: 0.2, ease: "none" }, END);
      tl.to("#hook-b", { opacity: 1, duration: 0.25, ease: "none" }, END + 0.1);
      tl.to("#c-aitana", { opacity: 0, duration: 0.35, ease: "none" }, END);
      tl.set("#c-leo .name span, #c-leo .rest, #c-leo .scrim", { opacity: 0 }, END - 0.01);
      tl.fromTo("#c-leo", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "none", immediateRender: false }, END);
      tl.fromTo("#b-leo", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none", immediateRender: false }, END);
      tl.to("#b-aitana", { opacity: 0, duration: 0.5, ease: "none" }, END + 0.5);
      tl.fromTo("#pill", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, END + 0.3);
      tl.to("#pill", { opacity: 0, duration: 0.2, ease: "none" }, 13.0);
      [0.5, 1.0].forEach((d) => { tl.set("#cursor", { opacity: 0 }, END + d); tl.set("#cursor", { opacity: 1 }, END + d + 0.25); });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
